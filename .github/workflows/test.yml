name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # pnpm and the node of .nvmrc in one action. It runs the frozen install too.
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm tsc
      # Dead code and unused dependencies (knip.ts): with the tests, and without them.
      - run: pnpm knip
      - run: pnpm knip --production
      - run: pnpm test
      - run: pnpm build
