name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

env:
  CI: true

jobs:
  version:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v7

      # pnpm and the node of .nvmrc in one action, as in monocore and factory. It runs the frozen install too.
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Create and publish versions
        # v2 has no major tag. Its inputs are v1's renamed, and it reads the token only from github-token.
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm ci:publish
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
